<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>F1TV Overlay</title>
    <link rel="stylesheet" href="/css/f1tv_overlay.css">
</head>
<body>
    <div id="connection-status" class="overlay-component always-visible">DISCONNECTED</div>

    <div id="overlay-container">
        <!-- Settings Panel -->
        <div id="settings-panel">
            <h3>F1TV Overlay Settings</h3>
            <div class="settings-grid" id="settings-checkboxes">
                <!-- populated by JS -->
            </div>
            <div class="preset-btns">
                <button class="preset-btn" onclick="applyPreset('broadcast')">Broadcast</button>
                <button class="preset-btn" onclick="applyPreset('cockpit')">Cockpit</button>
                <button class="preset-btn" onclick="applyPreset('all')">All On</button>
                <button class="preset-btn" onclick="applyPreset('none')">All Off</button>
            </div>
        </div>

        <!-- Overlays -->
        <div id="driver-name" class="overlay-component broadcast-only" data-component="Driver Name"></div>
        <div id="lap-timer" class="overlay-component broadcast-only" data-component="Lap Timer"></div>
        <div id="live-speed" class="overlay-component cockpit-only" data-component="Live Speed"></div>
        <div id="ahead-behind" class="overlay-component broadcast-only" data-component="Ahead & Behind"></div>
        <div id="session-info" class="overlay-component always-visible" data-component="Session Info"></div>
        <div id="tenths-timing" style="display: none;"></div>
        <div id="mini-leaderboard" class="overlay-component always-visible" data-component="Mini Leaderboard"></div>
        <div id="fastest-lap" class="overlay-component always-visible hidden" data-component="Fastest Lap"></div>
        <div id="weather-panel" class="overlay-component always-visible" data-component="Weather"></div>
        <div id="pit-window" class="overlay-component always-visible" data-component="Pit Window"></div>
        <div id="full-leaderboard" class="overlay-component broadcast-only hidden" data-component="Full Leaderboard"></div>
        <div id="fastest-sectors" class="overlay-component broadcast-only hidden" data-component="Fastest Sectors"></div>


        <div id="pit-timer" class="overlay-component always-visible hidden" data-component="Pit Timer"></div>
    </div>

    <!-- ============================================================
         HALO HUD — cockpit-only, 1920x1080 absolute layer stack
         All coordinates scaled from SimHub HALO HUD.djson
         BaseWidth:2430 BaseHeight:1020  →  ScaleX:0.7901  ScaleY:1.0588
         ============================================================ -->
    <div id="halo-hud" class="mode-hidden">
<!-- Background Layers -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/bg.png'); left: 3.3px; top: 4.0px; width: 2423.4px; height: 1058.4px; transform: rotate(2deg); opacity: 0.8;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/bg.png'); left: 690.1px; top: 37.8px; width: 1100px; height: 500px; transform: rotate(4deg);"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/RoundBG.png'); left: 970.1px; top: 57.8px; width: 506px; height: 371px; transform: rotate(0.5deg); opacity: 0.8;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/CenterLight.png'); left: 1031.1px; top: 164.8px; width: 370px; height: 221px; transform: rotate(0.5deg); opacity: 1;"></div>

        <!-- Blue Strokes -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/LeftBG.png'); left: 389.1px; top: 261.8px; width: 453px; height: 376px; opacity: 0.3;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/RightBG.png'); left: 1593.1px; top: 239.8px; width: 374px; height: 271px; opacity: 0.3;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/BlueStroke.png'); left: 674.3px; top: 244.8px; width: 1147.4px; height: 260.5px;"></div>

        <!-- Main Strokes -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/Top Stroke.png'); left: 425.1px; top: 53.6px; width: 1600px; height: 372px;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/MediumStroke.png'); left: 296.1px; top: 208.6px; width: 1925px; height: 405px; opacity: 0.3;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/Bottom Stroke.png'); left: 405.1px; top: 378.6px; width: 1641.1px; height: 416.8px; opacity: 0.8;"></div>

        <!-- Throttle & Brake Base -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/Throttle&BrakeBG.png'); left: 805.3px; top: 143.8px; width: 842.1px; height: 308.7px; opacity: 0.7;"></div>
        
        <!-- ERS Battery -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_ERS/bg.png'); left: 334px; top: 333px; width: 460px; height: 374px; transform: rotate(-0.3deg);"></div>
        <!-- Used 0-3.png for the bright green active state, and added drop-shadow for the glow effect -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_ERS/0-3.png'); left: 319.5px; top: 357px; width: 489px; height: 327px; transform: rotate(-6.4deg); opacity: 1; filter: drop-shadow(0 0 15px rgba(23, 249, 72, 0.6));"></div>
        
        <!-- Throttle and Brake Active -->
        <div id="hud-brake-meter" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/Brake1.png'); left: 855.3px; top: 214.8px; width: 130.2px; height: 200.5px; opacity: 0; clip-path: inset(100% 0 0 0); transition: clip-path 0.062s linear, opacity 0.1s linear;"></div>
        <div id="hud-throttle-meter" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/100.png'); left: 1449.4px; top: 196.6px; width: 151.4px; height: 188.1px;"></div>

        <!-- Speedo Ring -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/RPMbg.png'); left: 1032.1px; top: 53.8px; width: 382px; height: 396px;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/RPM.png'); left: 1032.1px; top: 53.8px; width: 382px; height: 396px;"></div>
        <!-- Center RPM Stroke -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_RPMstroke/Red Bull Racing.png'); left: 1031.3px; top: 119.8px; width: 383.25px; height: 280.35px;"></div>

        <!-- Brackets -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/Brackets.png'); left: 958.1px; top: 175.8px; width: 530.2px; height: 201.6px; opacity: 0.8;"></div>

        <!-- Center Dial Text & Icons -->
        <div class="text-element" style="left: 1031.3px; top: 119.8px; width: 383px; height: 280px;">
            <!-- Faint offset shadows for numbers (Positioned ABOVE and LEFT of the main numbers based on JSON) -->
            <div id="hud-kmh-shadow" style="position: absolute; left: 90px; top: 57px; width: 180px; height: 71px; font-size: 75px; transform: rotate(-0.6deg); opacity: 0.1;">215</div>
            <div id="hud-mph-shadow" style="position: absolute; left: 95px; top: 137px; width: 180px; height: 71px; font-size: 65px; transform: rotate(-0.6deg); opacity: 0.1;">215</div>

            <!-- Main active numbers -->
            <div id="hud-kmh-main" style="position: absolute; left: 95px; top: 70px; width: 180px; height: 71px; font-size: 75px; transform: rotate(-0.6deg);">215</div>
            <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_RPMstroke/KMH.png'); left: 140px; top: 52px; width: 88px; height: 20px; transform: rotate(-1deg);"></div>
            <div id="hud-mph-main" style="position: absolute; left: 100px; top: 150px; width: 180px; height: 71px; font-size: 65px; transform: rotate(-0.6deg);">215</div>
            <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_RPMstroke/MPH.png'); left: 155px; top: 221px; width: 57.6px; height: 14.4px; transform: rotate(-1deg);"></div>
        </div>

        <!-- Label Shadows -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/THROTTLE.png'); left: 1412.0px; top: 364.7px; width: 145.2px; height: 38.5px; transform: rotate(1.5deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/BRAKE text.png'); left: 864.0px; top: 394.7px; width: 85.7px; height: 38.5px; transform: rotate(-2.5deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/GEARS.png'); left: 1879.0px; top: 356.7px; width: 112px; height: 66px; transform: rotate(1deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/RPM x1000.png'); left: 1778.0px; top: 444.7px; width: 186px; height: 108px; transform: rotate(2deg); opacity: 0.1;"></div>

        <!-- Other UI Labels -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_ERSpercent/100%25on.png'); left: 660px; top: 325px; width: 222px; height: 222px; transform: rotate(-4deg);"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/ERS.png'); left: 480px; top: 340px; width: 185px; height: 160px; transform: rotate(4deg);"></div>

        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/THROTTLE.png'); left: 1411.3px; top: 374.8px; width: 145.2px; height: 38.5px; transform: rotate(1.5deg);"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/BRAKE text.png'); left: 873.3px; top: 401.8px; width: 85.7px; height: 38.5px; transform: rotate(-2.5deg);"></div>

        <!-- Right Side Gears & Labels -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/GEARS.png'); left: 1870.1px; top: 367.8px; width: 112px; height: 66px; transform: rotate(1deg);"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/RPM x1000.png'); left: 1777.1px; top: 452.8px; width: 186px; height: 108px; transform: rotate(2deg);"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/OVERTAKE.png'); left: 1781px; top: 492px; width: 150.1px; height: 89.8px; transform: rotate(1deg);"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/0.png'); left: 1610.1px; top: 374.8px; width: 18.5px; height: 17px; transform: rotate(-5deg); opacity: 0.5;"></div>
        <!-- Dynamic Max RPM Label (replaces hardcoded 15.png) -->
        <div id="hud-max-rpm-text" style="position: absolute; left: 2083px; top: 652px; width: 31.5px; height: 30.5px; transform: rotate(30deg) scale(1.3, 0.85); transform-origin: right center; opacity: 1; font-family: 'F1 Bold', sans-serif; font-size: 30px; text-align: right; line-height: 30.5px; color: #738c9f;">15</div>

        <!-- Linear RPM Bar under Gears -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_Gears/rpmBG.png'); left: 1594px; top: 476px; width: 585px; height: 40px; transform: rotate(30deg); opacity: 0.5;"></div>
        <div id="hud-rpm-line" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets_Gears/Red Bull Racing.png'); left: 1594px; top: 476px; width: 585px; height: 40px; transform: rotate(30deg); filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5)); clip-path: inset(0 100% 0 0); transition: clip-path 0.062s linear;"></div>

        <!-- Gears Sequence Shadows -->
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/N.png'); left: 1652.3px; top: 303.1px; width: 39.6px; height: 30.6px; transform: rotate(3deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/1.png'); left: 1716.3px; top: 324.1px; width: 24.6px; height: 33.6px; transform: rotate(3deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/2.png'); left: 1772.3px; top: 348.1px; width: 31.8px; height: 34.8px; transform: rotate(2deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/3.png'); left: 1831.3px; top: 375.1px; width: 31.8px; height: 34.2px; opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/4.png'); left: 1888.3px; top: 413.1px; width: 30.0px; height: 30.6px; opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/5.png'); left: 1947.3px; top: 442.1px; width: 31.8px; height: 36.0px; transform: rotate(5deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/6.png'); left: 2004.3px; top: 484.1px; width: 30.0px; height: 31.8px; transform: rotate(5deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/7.png'); left: 2061.3px; top: 523.1px; width: 29.4px; height: 31.8px; transform: rotate(2deg); opacity: 0.1;"></div>
        <div class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/8.png'); left: 2115.3px; top: 566.1px; width: 31.2px; height: 36.6px; opacity: 0.1;"></div>

        <!-- Gears Sequence Active (Plain white base versions without the funky outline) -->
        <div id="hud-gear-0" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/N.png'); left: 1648px; top: 314px; width: 39.6px; height: 35.4px; transform: rotate(-1deg);"></div>
        <div id="hud-gear-1" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/1.png'); left: 1712px; top: 335px; width: 24.6px; height: 33.6px; transform: rotate(3deg);"></div>
        <div id="hud-gear-2" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/2.png'); left: 1768px; top: 359px; width: 31.8px; height: 34.8px; transform: rotate(4deg);"></div>
        <div id="hud-gear-3" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/3.png'); left: 1827px; top: 386px; width: 31.8px; height: 34.2px; transform: rotate(2deg);"></div>
        <div id="hud-gear-4" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/4.png'); left: 1884px; top: 424px; width: 30.0px; height: 30.6px; transform: rotate(2deg);"></div>
        <div id="hud-gear-5" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/5.png'); left: 1943px; top: 453px; width: 31.8px; height: 36.0px; transform: rotate(5deg);"></div>
        <div id="hud-gear-6" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/6.png'); left: 2000px; top: 495px; width: 30.0px; height: 31.8px; transform: rotate(8deg);"></div>
        <div id="hud-gear-7" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/7.png'); left: 2059px; top: 532px; width: 29.4px; height: 31.8px; transform: rotate(2deg);"></div>
        <div id="hud-gear-8" class="hud-element" style="background-image: url('F1TV - Halo HUD/_assets/8.png'); left: 2111px; top: 577px; width: 31.2px; height: 36.6px; transform: rotate(3deg);"></div>
    </div><!-- end #halo-hud -->

    <script src="/js/f1tv_overlay.js"></script>
</body>
</html>
