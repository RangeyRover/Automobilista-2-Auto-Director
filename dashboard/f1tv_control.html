<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1TV Overlay Control Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px;
        }
        h1 { color: #ffffff; margin-bottom: 5px; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #333;
            max-width: 500px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .preset-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid #333;
        }
        .preset-btn {
            background: #38383F;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .preset-btn:hover { background: #E10600; }
        
        #status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="status" style="background: #333;">CONNECTING...</div>
    
    <h1>F1TV Overlay Control Panel</h1>
    <p>Toggle elements here to instantly update the OBS overlay.</p>
    
    <div class="card">
        <div class="settings-grid" id="settings-checkboxes">
            <!-- Populated by JS -->
        </div>
        
        <div class="preset-btns">
            <button class="preset-btn" onclick="applyPreset('broadcast')">Broadcast</button>
            <button class="preset-btn" onclick="applyPreset('cockpit')">Cockpit</button>
            <button class="preset-btn" onclick="applyPreset('all')">All On</button>
            <button class="preset-btn" onclick="applyPreset('none')">All Off</button>
        </div>
    </div>

    <script>
        const components = [
            { id: 'full-leaderboard', name: 'Full Leaderboard', default: true, type: 'broadcast' },
            { id: 'mini-leaderboard', name: 'Mini Leaderboard', default: true, type: 'broadcast' },
            { id: 'driver-name', name: 'Driver Name', default: true, type: 'broadcast' },
            { id: 'lap-timer', name: 'Lap Timer', default: true, type: 'broadcast' },
            { id: 'live-speed', name: 'Live Speed', default: false, type: 'cockpit' },
            { id: 'ahead-behind', name: 'Ahead & Behind', default: true, type: 'broadcast' },
            { id: 'session-info', name: 'Session Info', default: true, type: 'broadcast' },
            { id: 'fastest-lap', name: 'Fastest Lap', default: true, type: 'broadcast' },
            { id: 'fastest-sectors', name: 'Fastest Sectors', default: true, type: 'broadcast' },
            { id: 'weather-panel', name: 'Weather', default: true, type: 'broadcast' },
            { id: 'pit-window', name: 'Pit Window', default: true, type: 'broadcast' },
            { id: 'pit-timer', name: 'Pit Timer', default: true, type: 'broadcast' },
            { id: 'connection-status', name: 'Connection Status', default: true, type: 'broadcast' }
        ];

        let ws;
        const config = {};

        function init() {
            const grid = document.getElementById('settings-checkboxes');
            components.forEach(c => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = `toggle-${c.id}`;
                
                const saved = localStorage.getItem(`toggle-${c.id}`);
                cb.checked = saved !== null ? saved === 'true' : c.default;
                config[c.id] = cb.checked;
                
                cb.addEventListener('change', (e) => {
                    localStorage.setItem(`toggle-${c.id}`, e.target.checked);
                    config[c.id] = e.target.checked;
                    sendConfig();
                });
                
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + c.name));
                grid.appendChild(label);
            });
            
            connect();
        }

        const presets = {
            'broadcast': ['full-leaderboard', 'mini-leaderboard', 'driver-name', 'lap-timer', 'ahead-behind', 'session-info', 'fastest-lap', 'fastest-sectors', 'weather-panel', 'pit-window', 'pit-timer', 'connection-status'],
            'cockpit': ['mini-leaderboard', 'fastest-lap', 'weather-panel', 'pit-window', 'pit-timer']
        };

        function applyPreset(preset) {
            components.forEach(c => {
                const cb = document.getElementById(`toggle-${c.id}`);
                if (preset === 'all') cb.checked = true;
                else if (preset === 'none') cb.checked = false;
                else cb.checked = presets[preset].includes(c.id);
                
                localStorage.setItem(`toggle-${c.id}`, cb.checked);
                config[c.id] = cb.checked;
            });
            sendConfig();
        }

        function sendConfig() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "f1tv_config",
                    config: config
                }));
            }
        }

        function connect() {
            ws = new WebSocket('ws://' + location.host + '/ws');
            const statusEl = document.getElementById('status');
            
            ws.onopen = () => {
                statusEl.innerText = "CONNECTED";
                statusEl.style.background = "#00A85C";
                // Send current config immediately on connect
                sendConfig();
            };
            
            ws.onclose = () => {
                statusEl.innerText = "DISCONNECTED";
                statusEl.style.background = "#C00000";
                setTimeout(connect, 2000);
            };
        }

        window.onload = init;
    </script>
</body>
</html>
