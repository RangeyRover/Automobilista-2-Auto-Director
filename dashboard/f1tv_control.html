<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1TV Overlay Control Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px;
        }
        h1 { color: #ffffff; margin-bottom: 5px; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #333;
            max-width: 500px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .preset-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid #333;
        }
        .preset-btn {
            background: #38383F;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .preset-btn:hover { background: #E10600; }
        
        #status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="status" style="background: #333;">CONNECTING...</div>
    
    <h1>F1TV Overlay Control Panel</h1>
    <p>Toggle elements here to instantly update the OBS overlay.</p>
    
    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
        <div class="card" style="flex: 1; min-width: 300px;">
            <div class="settings-grid" id="settings-checkboxes">
                <!-- Populated by JS -->
            </div>
            
            <div class="preset-btns">
                <button class="preset-btn" onclick="applyPreset('broadcast')">Broadcast</button>
                <button class="preset-btn" onclick="applyPreset('cockpit')">Cockpit</button>
                <button class="preset-btn" onclick="applyPreset('all')">All On</button>
                <button class="preset-btn" onclick="applyPreset('none')">All Off</button>
            </div>
        </div>

        <div class="card" style="flex: 1; min-width: 300px;">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 18px; color: #ffffff;">Auto Camera Pool Settings</h3>
            <div class="settings-grid" id="camera-checkboxes" style="margin-bottom: 20px;">
                <label><input type="checkbox" class="cam-cb" value="1"> 1. Cockpit</label>
                <label><input type="checkbox" class="cam-cb" value="2"> 2. Chase</label>
                <label><input type="checkbox" class="cam-cb" value="3"> 3. Roof</label>
                <label><input type="checkbox" class="cam-cb" value="4"> 4. Bonnet</label>
                <label><input type="checkbox" class="cam-cb" value="5"> 5. Bumper</label>
                <label><input type="checkbox" class="cam-cb" value="6"> 6. Onboard</label>
                <label><input type="checkbox" class="cam-cb" value="7"> 7. Trackside</label>
            </div>
            
            <div style="border-top: 1px solid #333; padding-top: 15px; display: flex; flex-direction: column; gap: 8px;">
                <label>
                    <input type="checkbox" id="toggle-disable-camera-change"> 
                    <strong>Disable Auto Cam Switch</strong>
                </label>
                <p style="margin: 0; font-size: 13px; color: #888;">Freeze camera angle switching while keeping auto focus driver tracking active.</p>
            </div>
        </div>
    </div>

    <script>
        const components = [
            { id: 'full-leaderboard', name: 'Full Leaderboard', default: true, type: 'broadcast' },
            { id: 'mini-leaderboard', name: 'Mini Leaderboard', default: true, type: 'broadcast' },
            { id: 'driver-name', name: 'Driver Name', default: true, type: 'broadcast' },
            { id: 'lap-timer', name: 'Lap Timer', default: true, type: 'broadcast' },
            { id: 'live-speed', name: 'Live Speed', default: false, type: 'cockpit' },
            { id: 'ahead-behind', name: 'Ahead & Behind', default: true, type: 'broadcast' },
            { id: 'session-info', name: 'Session Info', default: true, type: 'broadcast' },
            { id: 'fastest-lap', name: 'Fastest Lap', default: true, type: 'broadcast' },
            { id: 'fastest-sectors', name: 'Fastest Sectors', default: true, type: 'broadcast' },
            { id: 'weather-panel', name: 'Weather', default: true, type: 'broadcast' },
            { id: 'pit-window', name: 'Pit Window', default: true, type: 'broadcast' },
            { id: 'pit-timer', name: 'Pit Timer', default: true, type: 'broadcast' },
            { id: 'connection-status', name: 'Connection Status', default: true, type: 'broadcast' },
            { id: 'tenths-timing', name: 'Tenths Timing', default: true, type: 'broadcast' },
            { id: 'interval-gaps', name: 'Interval Gaps', default: false, type: 'broadcast' }
        ];

        let ws;
        const config = {};
        let cameraConfig = {
            trackside_keys: ["7"],
            pool_close_racing: ["1", "1", "1", "2", "3", "7"],
            pool_standard: ["7", "7", "7", "7", "2", "3"],
            enabled_cameras: [],
            disable_camera_change: false
        };

        function init() {
            const grid = document.getElementById('settings-checkboxes');
            components.forEach(c => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = `toggle-${c.id}`;
                
                const saved = localStorage.getItem(`toggle-${c.id}`);
                cb.checked = saved !== null ? saved === 'true' : c.default;
                config[c.id] = cb.checked;
                
                cb.addEventListener('change', (e) => {
                    localStorage.setItem(`toggle-${c.id}`, e.target.checked);
                    config[c.id] = e.target.checked;
                    sendConfig();
                });
                
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + c.name));
                grid.appendChild(label);
            });
            
            // Wire up camera config listeners
            document.querySelectorAll('.cam-cb').forEach(cb => {
                cb.addEventListener('change', saveCameraConfig);
            });
            const disableSwitchCb = document.getElementById('toggle-disable-camera-change');
            if (disableSwitchCb) {
                disableSwitchCb.addEventListener('change', saveCameraConfig);
            }

            loadCameraConfig();
            connect();
        }

        async function loadCameraConfig() {
            try {
                const res = await fetch('camera_config.json?t=' + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    cameraConfig = Object.assign(cameraConfig, data);
                    applyCameraConfigToUI();
                }
            } catch (e) {
                console.error("Failed to load camera_config.json", e);
            }
        }

        function applyCameraConfigToUI() {
            const enabledList = cameraConfig.enabled_cameras || [];
            document.querySelectorAll('.cam-cb').forEach(cb => {
                cb.checked = enabledList.length === 0 || enabledList.includes(cb.value);
            });
            const disableSwitchCb = document.getElementById('toggle-disable-camera-change');
            if (disableSwitchCb) {
                disableSwitchCb.checked = !!cameraConfig.disable_camera_change;
            }
        }

        function saveCameraConfig() {
            const enabledList = [];
            document.querySelectorAll('.cam-cb').forEach(cb => {
                if (cb.checked) {
                    enabledList.push(cb.value);
                }
            });
            
            const allChecked = enabledList.length === 7;
            cameraConfig.enabled_cameras = allChecked ? [] : enabledList;
            
            const disableSwitchCb = document.getElementById('toggle-disable-camera-change');
            if (disableSwitchCb) {
                cameraConfig.disable_camera_change = disableSwitchCb.checked;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "save_json",
                    path: "camera_config.json",
                    content: cameraConfig
                }));
            }
        }

        const presets = {
            'broadcast': ['full-leaderboard', 'mini-leaderboard', 'driver-name', 'lap-timer', 'ahead-behind', 'session-info', 'fastest-lap', 'fastest-sectors', 'weather-panel', 'pit-window', 'pit-timer', 'connection-status', 'tenths-timing'],
            'cockpit': ['mini-leaderboard', 'fastest-lap', 'weather-panel', 'pit-window', 'pit-timer', 'tenths-timing']
        };

        function applyPreset(preset) {
            components.forEach(c => {
                const cb = document.getElementById(`toggle-${c.id}`);
                if (preset === 'all') cb.checked = true;
                else if (preset === 'none') cb.checked = false;
                else cb.checked = presets[preset].includes(c.id);
                
                localStorage.setItem(`toggle-${c.id}`, cb.checked);
                config[c.id] = cb.checked;
            });
            sendConfig();
        }

        function sendConfig() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "f1tv_config",
                    config: config
                }));
            }
        }

        function connect() {
            ws = new WebSocket('ws://' + location.host + '/ws');
            const statusEl = document.getElementById('status');
            
            ws.onopen = () => {
                statusEl.innerText = "CONNECTED";
                statusEl.style.background = "#00A85C";
                sendConfig();
                // Push cameraConfig on load to sync with backend state
                saveCameraConfig();
            };
            
            ws.onclose = () => {
                statusEl.innerText = "DISCONNECTED";
                statusEl.style.background = "#C00000";
                setTimeout(connect, 2000);
            };
        }

        window.onload = init;
    </script>
</body>
</html>
