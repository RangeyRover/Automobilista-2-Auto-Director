<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Converted Dashboard</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
        .dashboard-container { position: relative; width: 740px; height: 148px; }
        /* Default layer handling to not disrupt position */
        .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div class='dashboard-container'>
<div class='layer Border'>
<div class='rectangle BG' style="position: absolute; left: 0.0px; top: 0.0px; width: 780.0px; height: 148.0px; background-color: rgba(0, 0, 0, 1.00)"></div>
<div class='rectangle Team_Colour' style="position: absolute; left: 7.0px; top: 86.0px; width: 11.0px; height: 51.0px; background-color: rgba(41, 70, 67, 1.00)"></div>
<div class='rectangle RectangleItem' style="position: absolute; left: 0.0px; top: 0.0px; width: 780.0px; height: 75.0px; background-color: rgba(240, 240, 240, 1.00)"></div>
</div>

<div class='layer Gaps'>
<div id='Green_Arrow' class='image Green_Arrow' style="position: absolute; left: 710.0px; top: 78.0px; width: 25.0px; height: 25.0px; background-size: contain; background-repeat: no-repeat; background-position: center; background-image: url('assets/MM season 13/Green_triangle.svg.png'); transform: rotate(180deg);"></div>
<div id='Red_Arrow' class='image Red_Arrow' style="position: absolute; left: 710.0px; top: 119.0px; width: 25.0px; height: 25.0px; background-size: contain; background-repeat: no-repeat; background-position: center; background-image: url('assets/MM season 13/Red_triangle.svg.png');"></div>
<div id='Driver_Behind' class='text Driver_Behind' style="position: absolute; left: 290.0px; top: 115.0px; width: 410.0px; height: 35.0px; font-size: 29.0px; font-family: 'KH Interference'; color: rgba(255, 255, 0, 1.00); font-weight: 300; text-align: left; display: flex; align-items: center">ShatteredCompass</div>
<div id='Driver_Ahead' class='text Driver_Ahead' style="position: absolute; left: 290.0px; top: 78.0px; width: 410.0px; height: 35.0px; font-size: 29.0px; font-family: 'KH Interference'; color: rgba(255, 255, 0, 1.00); font-weight: 300; text-align: left; display: flex; align-items: center">ShatteredCompass</div>
<div id='Gap_Ahead' class='text Gap_Ahead' style="position: absolute; left: 587.0px; top: 73.0px; width: 120.0px; height: 50.0px; font-size: 30.0px; font-family: 'KH Interference'; color: rgba(255, 255, 0, 1.00); text-align: center; display: flex; align-items: center; justify-content: center">+5.42</div>
<div id='Gap_Behind' class='text Gap_Behind' style="position: absolute; left: 587.0px; top: 110.0px; width: 120.0px; height: 50.0px; font-size: 30.0px; font-family: 'KH Interference'; color: rgba(255, 255, 0, 1.00); text-align: center; display: flex; align-items: center; justify-content: center">-5.42</div>
</div>

<div class='layer Team'>
<div id='Team_Name' class='text Team_Name' style="position: absolute; left: 26.0px; top: 77.0px; width: 268.0px; height: 75.0px; font-size: 36.0px; font-family: 'KH Interference'; color: rgba(255, 255, 255, 1.00); text-align: left; display: flex; align-items: center">Force India</div>
<div id='Team_Logo' class='image Team_Logo' style="position: absolute; left: 70.0px; top: 0.0px; width: 75.0px; height: 75.0px; background-color: rgba(1, 8, 64, 1.00); background-size: contain; background-repeat: no-repeat; background-position: center;"></div>
</div>

<div class='layer Driver_Info'>
<div id='Driver' class='text Driver' style="position: absolute; left: 147.0px; top: 3.0px; width: 592.0px; height: 75.0px; font-size: 50.0px; font-family: 'KH Interference'; color: rgba(0, 0, 0, 1.00); font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center">Shattered.Compass</div>
<div id='Pos' class='text Pos' style="position: absolute; left: 2.0px; top: 4.0px; width: 70.0px; height: 75.0px; font-size: 39.0px; font-family: 'KH Interference'; color: rgba(0, 0, 0, 1.00); font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center">4</div>
</div>

    </div>
    
    <script>
        let teamMappings = {};
        
        async function loadTeamMappings() {
            try {
                const response = await fetch('drivers_teams.json');
                if (response.ok) {
                    teamMappings = await response.json();
                } else {
                    console.error("Failed to load team mappings:", response.status);
                }
            } catch (err) {
                console.error("Error fetching team mappings:", err);
            }
        }
        
        function getTeamData(driverName) {
            if (!driverName) return { team: "Reserve", color: "#aa14e0", logo: "MM.png" };
            
            if (teamMappings[driverName]) return teamMappings[driverName];
            
            for (const [key, val] of Object.entries(teamMappings)) {
                if (key.toLowerCase() === driverName.toLowerCase()) {
                    return val;
                }
            }
            
            return { team: "Reserve", color: "#aa14e0", logo: "MM.png" };
        }
        
        function connectWebSocket() {
            const ws = new WebSocket(`ws://${window.location.host}/ws`);
            
            ws.onopen = () => {
                console.log("Connected to telemetry bridge");
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (!data.viewed) return;
                
                const viewed = data.viewed;
                const ahead = data.ahead;
                const behind = data.behind;
                
                // Driver info
                document.getElementById('Driver').innerText = viewed.name || "-";
                document.getElementById('Pos').innerText = viewed.position > 0 ? viewed.position : "-";
                
                // Team Info
                const teamData = getTeamData(viewed.name);
                document.getElementById('Team_Name').innerText = teamData.team;
                
                const teamColorRect = document.querySelector('.Team_Colour');
                if (teamColorRect) teamColorRect.style.backgroundColor = teamData.color;
                
                document.getElementById('Team_Logo').style.backgroundImage = `url('assets/MM season 13/${teamData.logo}')`;
                
                // Gaps
                if (ahead && ahead.name && ahead.name !== "Unknown Driver" && !ahead.name.includes("Safety Car")) {
                    document.getElementById('Driver_Ahead').innerText = ahead.name;
                    document.getElementById('Gap_Ahead').innerText = "+" + (ahead.gap_seconds || 0.0).toFixed(1) + "s";
                    document.getElementById('Green_Arrow').style.display = 'block';
                } else {
                    document.getElementById('Driver_Ahead').innerText = "-";
                    document.getElementById('Gap_Ahead').innerText = "-";
                    document.getElementById('Green_Arrow').style.display = 'none';
                }
                
                if (behind && behind.name && behind.name !== "Unknown Driver" && !behind.name.includes("Safety Car")) {
                    document.getElementById('Driver_Behind').innerText = behind.name;
                    document.getElementById('Gap_Behind').innerText = "-" + (behind.gap_seconds || 0.0).toFixed(1) + "s";
                    document.getElementById('Red_Arrow').style.display = 'block';
                } else {
                    document.getElementById('Driver_Behind').innerText = "-";
                    document.getElementById('Gap_Behind').innerText = "-";
                    document.getElementById('Red_Arrow').style.display = 'none';
                }
            };
            
            ws.onclose = () => {
                setTimeout(connectWebSocket, 1000);
            };
        }
        
        window.onload = () => {
            loadTeamMappings().then(connectWebSocket);
        };
    </script>
</body>
</html>
